name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libx11-6 libice6 libsm6
          if ($LASTEXITCODE -ne 0) { throw 'Linux dependencies failed' }
      - name: Restore
        run: dotnet restore Open-LLM-Cluster.slnx
      - name: Build
        run: dotnet build Open-LLM-Cluster.slnx -c Release --no-restore
      - name: Tests
        run: dotnet test --project tests/OpenLLMCluster.Tests/OpenLLMCluster.Tests.csproj -c Release --no-build
